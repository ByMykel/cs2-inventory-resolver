name: Update inventory data

on:
  schedule:
    - cron: '0 6 * * *' # Every day at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch upstream inventory.json
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/inventory.json" \
            -o "$RUNNER_TEMP/inventory.raw.json"
          jq -e '
            type == "object"
            and ((["skins","crates","stickers","keychains","agents"] - keys) == [])
            and (.skins | length) > 0
          ' "$RUNNER_TEMP/inventory.raw.json" > /dev/null
          jq -c . "$RUNNER_TEMP/inventory.raw.json" > "$RUNNER_TEMP/inventory.min.json"
          mv "$RUNNER_TEMP/inventory.min.json" data/inventory.json

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/inventory.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Snapshot previous state
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git show HEAD:data/inventory.json > "$RUNNER_TEMP/inventory.old.json"
          echo "PREV_VERSION=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Commit updated inventory data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inventory.json
          git commit -m "chore: update inventory data"

      - name: Bump patch version
        if: steps.diff.outputs.changed == 'true'
        id: version
        run: |
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          git add package.json package-lock.json
          git commit -m "$NEW_VERSION"
          git tag "$NEW_VERSION"

      - name: Generate release notes
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs \
            "$RUNNER_TEMP/inventory.old.json" \
            data/inventory.json \
            "$PREV_VERSION" \
            "${{ steps.version.outputs.version }}" \
            > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Push commits and tag
        if: steps.diff.outputs.changed == 'true'
        run: git push origin main --tags

      - name: Setup Node.js
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies and build
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm run build
          npm test

      - name: Publish to npm
        if: steps.diff.outputs.changed == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        if: steps.diff.outputs.changed == 'true'
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
